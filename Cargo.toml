[package]
name = "gh-watch"
version = "0.1.5"
edition = "2024"
description = "Know when GitHub issues you care about change, through the gh CLI: as a library, a CLI, or a gh extension"
license = "MIT"
repository = "https://github.com/j-dominguez9/gh-watch"
readme = "README.md"
keywords = ["github", "gh", "notifications", "issues", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "gh_watch"
path = "src/lib.rs"

[[bin]]
name = "gh-watch"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = "0.25.19"
